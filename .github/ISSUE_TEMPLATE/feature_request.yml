name: Feature request
description: Suggest a firmware, hardware-support, remote-mapping, or documentation improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What would you like YAMuino to do?
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Use case
      description: Explain the hardware or workflow that motivates the request.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Technical details
      description: Include known NEC address/commands, measurements, or references if relevant.
